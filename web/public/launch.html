<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch Training</title>
  <link rel="stylesheet" href="/launch.css">
  <script src="/launch.js" defer></script>
</head>
<body>
  <header class="header">
    <img src="/brand/medverse-logo.svg" class="logo" id="tenantLogo" alt="Medverse Demo Clinic" width="140" height="28">
    <div class="header-title" id="tenantName">Medverse Demo Clinic</div>
  </header>

  <main class="panel">
    <p class="panel-title">You are about to start</p>
    <h1 class="training-name" id="trainingName">Training</h1>
    <p class="training-meta" id="trainingMeta"></p>

    <p class="hint">
      This training runs in a streamed session. Keep this tab open until it loads.
    </p>
    <p class="hint" id="launchStatus" role="status" aria-live="polite"></p>

    <div class="actions">
      <button type="button" class="button" id="startTraining" disabled>Start training</button>
      <button type="button" class="button-secondary" id="back">Back</button>
    </div>
    <noscript><p>JavaScript is required to select your hospital’s branding and start this training.</p></noscript>
  </main>

  <footer class="footer">© Medverse GmbH</footer>
</body>
</html>
